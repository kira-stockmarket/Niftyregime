name: Daily Nifty 50 Prediction Pipeline

on:
  schedule:
    # Runs at 10:30 AM UTC (4:00 PM IST) Monday through Friday.
    # This ensures the NSE market has closed and EOD data is available on yfinance.
    - cron: '30 10 * * 1-5'
  
  workflow_dispatch: 
    # This allows you to manually trigger the workflow from the GitHub UI at any time.

jobs:
  run-prediction-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Caches your dependencies to speed up daily runs

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Ensure you have a requirements.txt with pandas, numpy, yfinance, lightgbm, hmmlearn, etc.
          pip install -r requirements.txt

      - name: Run Nifty 50 Predictor
        env:
          # Forces Python to print output immediately to the GitHub Actions console
          PYTHONUNBUFFERED: 1 
        run: |
          # Replace with the actual name of your python script
          python main_predictor.py

      - name: Archive Prediction Results
        uses: actions/upload-artifact@v4
        with:
          name: daily-regime-prediction
          # Assumes your script saves a CSV or TXT file to an 'output' folder
          path: output/
          retention-days: 5
